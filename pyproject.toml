[project]
name = "mymcp"
version = "0.0.1"
description = "MyMCP"
authors = [
    { name = "AntonioLRL", email = "antonio.l.rodriguez.lopez@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=3.0.0",              # <-- UNCOMMENTED: Required to run the MCP server framework
    "langchain-core>=0.3.76",      # <-- UNCOMMENTED: Required if your servers use LangChain types
    "praw==7.8.1",                 # <-- UNCOMMENTED: Required for your mcp-reddit script to function    
    #"docker==7.1.0",
    #"tabulate==0.9.0",
    #"markdownify==1.0.0",
    #"fredapi==0.5.2",
    #"duckduckgo-search==7.5.0",
    #"selenium==4.7.2",
    #"pyvirtualdisplay==3.0",
    #"GoogleNews==1.6.15",
    "youtube-transcript-api==1.1.1",
    #"webdriver-manager==4.0.2",
    "google-api-python-client==2.172.0",
    #"praw==7.8.1",
    #"fastmcp>=3.0.0",
    #"crawl4ai>=0.8.6",
    #"langchain-core>=0.3.76",
    #"langchain-litellm==0.3.0",
]

[project.scripts]
mcp-reddit = "mymcp.reddit.server:run"
mcp-youtube = "mymcp.youtube.server:run"
mcp-crawl4ai = "mymcp.crawl4ai.server:run"
mcp-docker = "mymcp.docker.server:run"
mcp-google-scholar = "mymcp.google_scholar.server:run"
mcp-telegram = "mymcp.telegram.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mymcp"]