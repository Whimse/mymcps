[project]
name = "mymcp"
version = "0.0.1"
description = "MyMCP"
authors = [
    { name = "AntonioLRL", email = "antonio.l.rodriguez.lopez@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=3.0.0",
    "langchain-core>=0.3.76",
    "praw==7.8.1",
    "python-dateutil>=2.8.2",
    "jinja2>=3.1.3",
    "numpy>=1.26.0",                # <--- ADD THIS LINE
    #"docker==7.1.0",
    #"tabulate==0.9.0",
    #"markdownify==1.0.0",
    #"fredapi==0.5.2",
    #"duckduckgo-search==7.5.0",
    #"selenium==4.7.2",
    #"pyvirtualdisplay==3.0",
    #"GoogleNews==1.6.15",
    "youtube-transcript-api==1.1.1",
    #"webdriver-manager==4.0.2",
    "google-api-python-client==2.172.0",
    #"praw==7.8.1",
    #"fastmcp>=3.0.0",
    #"crawl4ai>=0.8.6",
    #"langchain-core>=0.3.76",
    "langchain-litellm==0.3.0",
    "beautifulsoup4>=4.12.3",       # <--- ADD THIS LINE
    "semanticscholar>=0.12.0",
    "crawl4ai>=0.9.2",
]

[project.scripts]
mcp-reddit = "mymcp.reddit.server:run"
mcp-youtube = "mymcp.youtube.server:run"
mcp-crawl4ai = "mymcp.crawl4ai.server:run"
mcp-docker = "mymcp.docker.server:run"
mcp-google-scholar = "mymcp.google_scholar.server:run"
mcp-telegram = "mymcp.telegram.server:run"
mcp-semantic-scholar = "mymcp.semantic_scholar.server:run"
mcp-shell = "mymcp.shell.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mymcp"]
